# Configurazione del Supabase LOCALE (npx supabase start). NON usare `supabase config push`:
# applicherebbe questi indirizzi al progetto online. Online si configurano dalla dashboard
# (Authentication -> URL Configuration), vedi EMAIL_SETUP.md.
[auth]
# Il link di reset password rimanda a `${window.location.origin}/reset-password`:
# in sviluppo l'app gira su localhost:5173, che deve essere un indirizzo consentito.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173",
  "http://127.0.0.1:5173/**",
]
